name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # GitHub Pages for this repo builds from the master branch root, so
      # publish the built site there. [skip ci] prevents this workflow from
      # re-triggering itself; the Pages branch build still picks the commit up.
      - name: Commit built site to branch root
        run: |
          rm -rf assets
          cp -r dist/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets favicon.svg .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish built site [skip ci]"
            git push
          fi
      # Also deploy as a Pages artifact so the site keeps working if Pages
      # is ever switched to workflow-based deployments.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
